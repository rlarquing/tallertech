name: Sync DB to Turso

# Sincroniza el schema de Prisma hacia la base Turso de producción.
# Usa un script Node propio (@libsql/client) porque el CLI de Prisma 7
# no soporta el esquema libsql:// en datasource.url.
# Se dispara cuando cambia el schema o manualmente desde Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'scripts/sync-turso.mjs'
      - '.github/workflows/sync-turso.yml'
  workflow_dispatch:

# Evita dos syncs concurrentes que pisen la base
concurrency:
  group: turso-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Verify Turso connection
        run: |
          node -e "
            const c = require('@libsql/client').createClient({
              url: process.env.DATABASE_URL,
              authToken: process.env.DATABASE_AUTH_TOKEN
            });
            c.execute('SELECT 1')
              .then(() => console.log('Turso OK'))
              .catch(e => { console.error('Turso FAIL:', e); process.exit(1); });
          "

      - name: Sync schema to Turso
        run: bun run scripts/sync-turso.mjs

      - name: Generate Prisma Client
        run: bunx prisma generate
